kind = "web"
previewPath = "/"
title = "Bareeq Atelier Shop"
description = "An independent Next.js bilingual silver jewelry shop with MongoDB-backed customer and admin flows."
version = "1.0.0"
id = "artifacts/bareeq-shop"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api/shop", "/_next"]
localPort = 23542

[services.development]
run = "pnpm --filter @workspace/bareeq-shop run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/bareeq-shop", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/bareeq-shop", "run", "serve"]

[services.production.run.env]
PORT = "23542"
NODE_ENV = "production"

[services.env]
PORT = "23542"
BASE_PATH = "/"
